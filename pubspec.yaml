name: oob_menu
description: OOB Menu - Out of Boredom digital menu experience
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  smooth_page_indicator: ^1.1.0
  vector_math: ^2.1.4
  haptic_feedback: ^0.5.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
    - assets/images/
